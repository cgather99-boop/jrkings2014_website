<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Swag</title>
  <link rel="icon" href="Images/logo.png">
  <link rel="stylesheet" href="theme.css?v=4">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body data-page="swag">
  <header id="site-header" class="site-header"></header>

  <div class="layout">
    <div class="left-col">
      <nav id="sidebar" class="sidebar" aria-label="Site navigation"></nav>
      <section id="sponsors-card" class="card sponsors-card" aria-labelledby="sponsors-title"></section>
    </div>

    <main class="content">
      <div id="error" class="error" hidden></div>

      <section class="card" aria-labelledby="swag-title">
        <h1 id="swag-title">Team Swag</h1>
        <p id="swag-intro" class="swag-intro" hidden></p>
        <div id="swag" class="swag-grid"></div>
      </section>
    </main>
  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="app.js?v=4"></script>
</body>
</html>
